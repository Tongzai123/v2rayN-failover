name: package and release Zip

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target: # windows linux macos windows-desktop
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: package x64 arm64
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ubuntu-latest
    env:
      Target: |- 
        ${{
          case(
            inputs.target == 'windows-desktop', 'windows',
            inputs.target
          )
        }}
      Arch: |-
        ${{
          case(
            matrix.arch == 'x64', '64',
            matrix.arch
          ) 
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.arch }}
        path: v2rayN-${{ env.Target }}-${{ env.Arch }}
    
    - name: Get v2rayN-core-bin
      run: wget -nv -O v2rayN-$Target-$Arch.zip "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-$Target-$Arch.zip"
    
    - name: Package zip archive
      run: 7z a -tZip v2rayN-$Target-$Arch.zip v2rayN-$Target-$Arch -mx1

    - name: Rename windows-desktop 
      if: inputs.target == 'windows-desktop'
      run: mv "v2rayN-$Target-$Arch.zip" "v2rayN-$Target-$Arch-desktop.failover.zip"

    - name: Inspect package
      run: |
        set -euxo pipefail
        ls -lh v2rayN*.zip
    
    - name: Upload zip archive to release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        tag="${{ inputs.release_tag }}"
        repo="${{ github.repository }}"
        api="https://api.github.com/repos/${repo}"
        auth_headers=(
          -H "Authorization: Bearer ${GITHUB_TOKEN}"
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
        )

        release_json="$(mktemp)"
        curl -fsS "${auth_headers[@]}" "${api}/releases/tags/${tag}" -o "${release_json}"
        upload_url="$(jq -r '.upload_url' "${release_json}" | sed 's/{?name,label}//')"
        assets_url="$(jq -r '.assets_url' "${release_json}")"

        for file in v2rayN*.zip; do
          name="$(basename "${file}")"
          existing_id="$(
            curl -fsS "${auth_headers[@]}" "${assets_url}" |
              jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' |
              head -n 1
          )"

          if [ -n "${existing_id}" ]; then
            curl -fsS -X DELETE "${auth_headers[@]}" "${api}/releases/assets/${existing_id}"
          fi

          curl -fsS -X POST "${auth_headers[@]}" \
            -H "Content-Type: application/zip" \
            --data-binary @"${file}" \
            "${upload_url}?name=${name}" >/dev/null
        done
